<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --white: #FFFFFF;
            --brown: #641e16;
        }
        
        .navbar {
            background-color: var(--white) !important;
            border-bottom: 1px solid var(--brown);
        }
        
        .navbar-brand {
            color: var(--brown) !important;
            font-family: 'Times New Roman', serif;
            font-size: 1.5rem;
            order: 2;
        }
        
        .navbar-toggler {
            order: 1;
            border-color: var(--brown) !important;
        }
        
        .navbar-nav {
            order: 3;
        }
        
        .nav-link {
            color: var(--brown) !important;
            transition: opacity 0.3s ease;
        }
        
        .nav-link:hover {
            opacity: 0.8;
        }
        
        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='%23641e16' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e") !important;
        }
        
        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
                
        /* Ensure dropdown menu expands downward */
        .navbar-collapse {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--white);
            border-bottom: 1px solid var(--brown);
            z-index: 1000;
        }
        
        .navbar-nav .nav-item {
            border-bottom: 1px solid rgba(100, 30, 22, 0.2);
        }
        
        .navbar-nav .nav-item:last-child {
            border-bottom: none;
        }
        
        /* Add padding to body to account for fixed navbar */
        body {
            padding-top: 76px;
        }
    </style>
</head>
<body>
     <!-- Navigation Bar -->
     <nav class="navbar navbar-expand-lg fixed-top">

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

            </button>
            <a class="navbar-brand" href="./index.html">Sosina S. Alofipo</a>
            <div class="collapse navbar-collapse" id="navbarNav">

                    </li>
                    <li class="nav-item">

                    </li>
                    <li class="nav-item">

                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div id="contact">

    </div>

</body>
